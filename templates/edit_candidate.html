{% extends "base.html" %}

{% block title %}Edit Candidate{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Edit Candidate</h1>

    <form method="POST" action="{{ url_for('edit_candidate', cand_id=candidate.candID) }}" class="space-y-6">
        <div>
            <label for="candFName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
            <input type="text" id="candFName" name="candFName" value="{{ candidate.candFName }}" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        </div>

        <div>
            <label for="candLName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
            <input type="text" id="candLName" name="candLName" value="{{ candidate.candLName }}" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
        </div>

        <div>
            <label for="posID" class="block text-sm font-medium text-gray-700 mb-2">Position</label>
            <select id="posID" name="posID" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                {% for position in positions %}
                <option value="{{ position.posID }}" {% if position.posID == candidate.posID %}selected{% endif %}>
                    {{ position.posName }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="candStat" class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select id="candStat" name="candStat"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                <option value="active" {% if candidate.candStat == 'active' %}selected{% endif %}>Active</option>
                <option value="inactive" {% if candidate.candStat == 'inactive' %}selected{% endif %}>Inactive</option>
            </select>
        </div>

        <div class="flex space-x-4">
            <button type="submit"
                class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">
                Update Candidate
            </button>
            <a href="{{ url_for('candidates') }}"
                class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg text-center transition-colors duration-300">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
