{% extends "base.html" %}

{% block title %}Add Position{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Add New Position</h1>

    <form method="POST" action="{{ url_for('add_position') }}" class="space-y-6">
        <div>
            <label for="posName" class="block text-sm font-medium text-gray-700 mb-2">Position Name</label>
            <input type="text" id="posName" name="posName" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
            <label for="numOfPositions" class="block text-sm font-medium text-gray-700 mb-2">Number of Positions</label>
            <input type="number" id="numOfPositions" name="numOfPositions" min="1" value="1" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
            <label for="posStat" class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select id="posStat" name="posStat"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                <option value="open">Open</option>
                <option value="closed">Closed</option>
            </select>
        </div>

        <div class="flex space-x-4">
            <button type="submit"
                class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">
                Add Position
            </button>
            <a href="{{ url_for('positions') }}"
                class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg text-center transition-colors duration-300">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
