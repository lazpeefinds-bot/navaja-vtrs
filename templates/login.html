{% extends "base.html" %} {% block title %}Voter Login{% endblock %} {% block
content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8 mt-12">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Voter Login</h1>
  </div>

  <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
    <div>
      <label for="voterID" class="block text-sm font-medium text-gray-700 mb-2"
        >Voter ID</label
      >
      <input
        type="text"
        id="voterID"
        name="voterID"
        required
        placeholder="Enter your voter ID"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
    </div>

    <div>
      <label
        for="voterPass"
        class="block text-sm font-medium text-gray-700 mb-2"
        >Password</label
      >
      <input
        type="password"
        id="voterPass"
        name="voterPass"
        required
        placeholder="Enter your password"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300"
    >
      Login to Vote
    </button>
  </form>

 

  <div class="mt-4 text-center">
    <a
      href="{{ url_for('index') }}"
      class="text-indigo-600 hover:text-indigo-800"
      >Back to Home</a
    >
  </div>
</div>
{% endblock %}
